spring.application.name=taller
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taller_db}
spring.datasource.username=${DB_USER:${DB_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
